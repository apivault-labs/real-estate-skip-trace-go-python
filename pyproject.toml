[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apivault-real-estate-skip-trace-go"
version = "0.1.0"
description = "Python client for Real Estate Skip Trace on Apify. Run, resume and download results with diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name="ApiVault Labs"}]
keywords = ["apify", "python-sdk", "real", "estate", "skip", "trace", "go"]

[project.urls]
Homepage = "https://apify.com/apivault_labs/real-estate-skip-trace-go"
Source = "https://github.com/apivault-labs/real-estate-skip-trace-go-python"
Documentation = "https://github.com/apivault-labs/real-estate-skip-trace-go-python#readme"

[tool.setuptools.packages.find]
include = ["apivault_real_estate_skip_trace_go*"]
